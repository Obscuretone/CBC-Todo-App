name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: cbc_todo_test
          MARIADB_USER: ci_user
          MARIADB_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd='healthcheck.sh --connect --innodb_initialized'
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Test authentication, task lifecycle, and user isolation
        env:
          TEST_DATABASE_URL: mysql://ci_user:ci-password@127.0.0.1:3306/cbc_todo_test
        run: python -m unittest discover -s backend/tests -v
      - name: Validate local Compose configuration
        run: docker compose config --quiet
