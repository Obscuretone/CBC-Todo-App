services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql://todo_user:todo_pass@database:3306/cbc_todo
      REDIS_URI: redis://redis:6379/0
      SECRET_KEY: local-dev-secret
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      SANIC_DEBUG: "True"
      SANIC_AUTO_RELOAD: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cbc-todo-app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - cbc-todo-app
    command: npm start

  database:
    build:
      context: ./database
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=cbc_todo
      - MYSQL_USER=todo_user
      - MYSQL_PASSWORD=todo_pass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cbc-todo-app

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    networks:
      - cbc-todo-app

networks:
  cbc-todo-app:
    driver: bridge
