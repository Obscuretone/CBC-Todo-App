services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql://todo_user:todo_pass@database:3306/cbc_todo
      REDIS_URI: redis://redis:6379/0
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - database
      - redis
    networks:
      - cbc-todo-app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - cbc-todo-app
    command: npm start

  database:
    build:
      context: ./database
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=cbc_todo
      - MYSQL_USER=todo_user
      - MYSQL_PASSWORD=todo_pass
    networks:
      - cbc-todo-app

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    networks:
      - cbc-todo-app

networks:
  cbc-todo-app:
    driver: bridge
